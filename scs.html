<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-scs.png">
<meta name="apple-mobile-web-app-title" content="仕組">
<title>SCS｜冷却水を、止まる前に。</title>
<style>
:root{
  --bg:#eef3f8; --line:#d7e0ea; --ink:#12305a; --sub:#5f7189;
  --water:#13a6e3; --qual:#0e9bb5; --pump:#12a07a; --temp:#2a5bd7; --rad:#e08a1e; --alert:#e5484d; --ok:#1aa36b;
  --acc:var(--water);
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
}
body[data-mode="qual"]{--acc:var(--qual)}
body[data-mode="pump"]{--acc:var(--pump)}
body[data-mode="temp"]{--acc:var(--temp)}
body[data-mode="rad"]{--acc:var(--rad)}
body.alerting{--acc:var(--alert)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.app{display:grid;grid-template-columns:1fr 330px;height:100vh;height:100dvh}
.stage{position:relative;overflow:hidden;background:radial-gradient(120% 95% at 60% 45%,#dfe6ee 0%,#c9d4e0 55%,#b4c2d1 100%)}
.glow{position:absolute;inset:0;pointer-events:none;transition:background .8s;
  background:radial-gradient(45% 40% at 58% 56%, color-mix(in srgb,var(--acc) 12%, transparent), transparent 72%)}
#gl{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:none}

.copy{position:absolute;left:clamp(22px,3.2vw,44px);top:clamp(22px,3.4vw,40px);max-width:480px;pointer-events:none}
.kicker{font-size:13px;letter-spacing:.06em;color:var(--acc);font-weight:800;transition:color .5s;display:flex;align-items:center;gap:10px}
.kicker .live{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ok);letter-spacing:.1em}
.kicker .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:live 1.6s infinite}
@keyframes live{50%{opacity:.25}}
.copy h1{font-family:var(--mincho);font-size:clamp(30px,3.3vw,46px);line-height:1.36;font-weight:700;margin:10px 0 12px;word-break:keep-all;letter-spacing:.03em}
.copy p{font-size:15px;line-height:1.85;color:#33496a}
.copy .note{display:inline-block;margin-top:12px;font-size:13px;font-weight:700;color:var(--acc);border-left:3px solid var(--acc);padding:2px 0 2px 10px}
.copy .small{font-size:12px;color:var(--sub);margin-top:10px}
.copy.swap{animation:swap .55s ease}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.actions{position:absolute;left:50%;bottom:clamp(16px,3vh,28px);transform:translateX(-50%);display:flex;gap:10px}
.btn{min-height:54px;padding:0 24px;border-radius:27px;border:1.5px solid var(--line);background:rgba(255,255,255,.94);
  box-shadow:0 8px 22px rgba(18,48,90,.10);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:.3s}
.btn svg{width:18px;height:18px}
.btn.primary{border-color:var(--acc);color:var(--acc)}
.btn.act{background:var(--ink);border-color:var(--ink);color:#fff}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.hide{display:none}

.alert{position:absolute;left:50%;bottom:calc(clamp(16px,3vh,28px) + 70px);transform:translate(-50%,16px);opacity:0;pointer-events:none;max-width:min(580px,92%);
  background:#fff;border:1.5px solid var(--alert);border-radius:14px;padding:14px 24px;text-align:center;transition:.4s;box-shadow:0 12px 30px rgba(229,72,77,.18)}
.alert.show{opacity:1;transform:translate(-50%,0)}
.alert b{display:block;color:var(--alert);font-size:13px;letter-spacing:.06em;margin-bottom:4px}
.alert span{white-space:nowrap;font-size:17px;font-weight:700;line-height:1.5}
.alert.ok{border-color:var(--ok);box-shadow:0 12px 30px rgba(26,163,107,.16)}
.alert.ok b{color:var(--ok)}
.alert.info{border-color:var(--rad);box-shadow:0 12px 30px rgba(224,138,30,.16)}
.alert.info b{color:var(--rad)}
.toast{position:absolute;right:clamp(16px,2vw,28px);top:clamp(24px,4vh,40px);width:260px;border-radius:16px;padding:14px 16px;
  background:var(--ink);color:#fff;box-shadow:0 18px 40px rgba(18,48,90,.3);transform:translateX(330px);transition:transform .5s cubic-bezier(.2,.9,.3,1.2)}
.toast.show{transform:none}
.toast .t1{display:flex;align-items:center;gap:8px;font-size:12px;color:#b9c8dc;font-weight:700}
.toast .dot{width:10px;height:10px;border-radius:3px;background:var(--alert)}
.toast .t2{font-size:15px;font-weight:800;margin-top:6px;line-height:1.45}
.toast .t3{font-size:11px;color:#b9c8dc;margin-top:4px}

.side{background:#f8fafc;border-left:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px 16px;gap:9px}
.brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
.brand .b1{font-size:12px;letter-spacing:.16em;color:var(--sub);font-weight:800}
.brand .b2{font-size:13px;color:var(--sub);font-weight:700}
.cards{display:flex;flex-direction:column;gap:9px;flex:1}
.card{--c:var(--water);text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:12px 15px;background:#fff;
  transition:border-color .3s,box-shadow .3s;flex:1;display:flex;flex-direction:column;justify-content:center;gap:5px;min-height:88px}
.card[data-k="qual"]{--c:var(--qual)} .card[data-k="pump"]{--c:var(--pump)} .card[data-k="temp"]{--c:var(--temp)} .card[data-k="rad"]{--c:var(--rad)}
.card.on{border-color:var(--c);box-shadow:0 8px 22px color-mix(in srgb,var(--c) 18%, transparent)}
.card .hd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--c)}
.card .hd .sq{width:9px;height:9px;background:var(--c)}
.card .pn{font-size:14px;font-weight:800}
.vals{display:flex;gap:16px}
.v{flex:1;min-width:0}
.v .vn{font-size:11px;color:var(--sub);font-weight:700}
.v .num{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.v .num small{font-size:11px;color:var(--sub);font-weight:600;margin-left:3px}
.bar{position:relative;height:4px;border-radius:2px;background:#e3e9f1;margin-top:3px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--c);transition:width .25s linear,background .3s}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#9aaabd}
.v.bad .num{color:var(--alert)} .v.bad .bar i{background:var(--alert)}
.card.bad{border-color:var(--alert);animation:blink 1s infinite}
@keyframes blink{50%{background:#fff1f1}}
.home{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:#33496a;transition:.3s}
.home.on{border-color:var(--water);color:var(--water)}
.foot{font-size:11px;color:var(--sub);line-height:1.6}

.intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:rgba(244,248,252,.95);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .7s}
.intro.hide{opacity:0;pointer-events:none}
.intro .b1{font-size:13px;letter-spacing:.24em;color:var(--water);font-weight:800}
.intro h2{font-family:var(--mincho);font-size:clamp(32px,4.8vw,60px);font-weight:700;line-height:1.4;margin:18px 0 14px;letter-spacing:.03em}
.intro p{font-size:clamp(15px,1.6vw,19px);color:#33496a;line-height:1.8}
.intro .go{margin-top:34px;min-height:62px;padding:0 40px;border-radius:31px;background:var(--ink);color:#fff;font-size:18px;font-weight:800;box-shadow:0 10px 26px rgba(18,48,90,.25)}


#ui3d{position:absolute;inset:0;pointer-events:none}
#leads{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#leads line{stroke:var(--acc);stroke-width:1.3;transition:opacity .4s}
#leads circle{fill:var(--acc);stroke:#fff;stroke-width:2;transition:opacity .4s}
#pills>div{position:absolute;left:0;top:0;opacity:0;transition:opacity .4s;white-space:nowrap;will-change:transform}
#pills>div.on{opacity:1}
.pill{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px 12px 5px 10px;font-size:13px;font-weight:800;color:var(--ink);box-shadow:0 4px 12px rgba(18,48,90,.14)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.utag{background:var(--ink);color:#fff;border-radius:13px;padding:5px 13px;font-size:12px;font-weight:800;box-shadow:0 4px 12px rgba(18,48,90,.2)}
.utag b{color:#8fb4e6;margin-right:8px}
.utag.grey{background:#5f7189}
.badge{background:#8a97a8;color:#fff;border-radius:11px;padding:3px 11px;font-size:11px;font-weight:800;box-shadow:0 3px 8px rgba(18,48,90,.2);transition:background .3s,opacity .4s}
.badge.run{background:var(--ok)} .badge.err{background:var(--alert)}
.chips{display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:17px;padding:5px 7px 5px 13px;box-shadow:0 4px 12px rgba(18,48,90,.14)}
.chips .cl{font-size:12px;font-weight:800;color:var(--ink);margin-right:2px}
.chips .c{background:#8a97a8;color:#fff;border-radius:11px;padding:3px 11px;font-size:11px;font-weight:800;transition:background .3s}
.chips .c.run{background:var(--ok)} .chips .c.err{background:var(--alert)}
.home.auto{display:flex;align-items:center;justify-content:center;gap:8px}
.home.auto.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.autoBadge{position:absolute;left:20px;bottom:22px;transform:translateY(8px);opacity:0;transition:.4s;background:rgba(18,48,90,.88);color:#fff;font-size:12px;font-weight:700;padding:7px 15px;border-radius:15px;pointer-events:none;display:flex;gap:8px;align-items:center;white-space:nowrap}
.autoBadge.show{opacity:1;transform:none}
.autoBadge i{width:8px;height:8px;border-radius:50%;background:#ff6b6b;animation:live 1.2s infinite}
.gos{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;justify-content:center}
.intro .gos .go{margin-top:0}
.intro .go2{background:#fff;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none}
.hint{position:absolute;right:18px;bottom:20px;font-size:12px;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:6px;pointer-events:none;opacity:.85}
@media (orientation:portrait){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{border-left:0;border-top:1px solid var(--line);padding:12px 12px 16px}
  .brand,.foot{display:none}
  .cards{display:grid;grid-template-columns:1fr 1fr}
  .card{min-height:84px}
  .hint{display:none}
  .autoBadge{left:50%;bottom:90px;transform:translate(-50%,8px)}
  .autoBadge.show{transform:translate(-50%,0)}
}
@media (prefers-reduced-motion:reduce){.card.bad,.kicker .live::before{animation:none}}
</style>
</head>
<body data-mode="all">
<div class="app">
  <div class="stage" id="stage">
    <div class="glow"></div>
    <div id="ui3d"><svg id="leads"></svg><div id="pills"></div></div>
    <div class="copy" id="copy"></div>
    <div class="alert" id="alert"><b id="alertK"></b><span id="alertT"></span></div>
    <div class="toast" id="toast">
      <div class="t1"><span class="dot"></span>SCS 通知</div>
      <div class="t2" id="toastT"></div>
      <div class="t3">担当者のスマートフォン・PCへ（画面はイメージ）</div>
    </div>
    <div class="autoBadge" id="autoBadge"><i></i>自動再生中｜画面にふれると操作できます</div>
    <div class="hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9M21 3v6h-6"/></svg>ドラッグで回転・ユニットをタップ</div>
    <div class="actions">
      <button class="btn primary" id="bOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9l8-5 8 5M4 15l8 5 8-5M12 9v6"/></svg><span>中を見る</span></button>
      <button class="btn act hide" id="bAct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5l11 7-11 7z"/></svg><span></span></button>
    </div>
  </div>
  <aside class="side">
    <div class="brand"><span class="b1">KANNETSU</span><span class="b2">スマートクールシステム</span></div>
    <div class="cards" id="cards"></div>
    <button class="home auto" id="bAuto"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg><span>自動再生</span></button>
    <button class="home on" id="bHome">システム全体を見る</button>
    <div class="foot">カードをタップすると、そのユニットの中と動きを表示します。<br>数値・運転の様子は説明用のイメージです。</div>
  </aside>
</div>

<div class="intro" id="intro">
  <div class="b1">SMART COOL SYSTEM</div>
  <h2>冷却水のトラブルは、<br>止まる前に気づける。</h2>
  <p>水質・水圧・水量・水温。<br>SCSが4つを見張る仕組みを、触って確かめてください。</p>
  <div class="gos"><button class="go" id="bGo">SCSの中を見る</button><button class="go go2" id="bAutoGo">自動再生で見る</button></div>
</div>
